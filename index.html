<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080f" />
    <!-- 主题预置：在首屏绘制前确定白天/黑夜，避免闪烁 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ncs:theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme =
            saved === 'light' || saved === 'dark' ? saved : prefersLight ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f2f6fc' : '#05080f')
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <meta
      name="description"
      content="夜十字工作室 Noctu Crucis Studio —— 一个普普通通的 Minecraft 工作室，一群人为了爱好而凑在一起。我们很小，但我们很努力！"
    />
    <meta
      name="keywords"
      content="夜十字,夜十字工作室,Noctu Crucis Studio,mc,MC,我的世界,工作室,地图,解密地图,minecraft"
    />
    <meta name="author" content="夜十字工作室" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="夜十字工作室 · Noctu Crucis Studio" />

      property="og:description"
      content="一个普普通通的 Minecraft 工作室，一群人为了爱好而凑在一起。我们很小，但我们很努力！"
    />
    <meta property="og:image" content="/img/og-cover.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <title>夜十字工作室 · Noctu Crucis Studio</title>
  </head>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
